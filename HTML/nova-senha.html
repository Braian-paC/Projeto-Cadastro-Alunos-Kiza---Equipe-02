<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Nova senha - Portal Academico</title>
    <link rel="stylesheet" href="../css/style.css" />
  </head>
  <body>
    <header>
      <strong>Portal Academico</strong>
      <h1>Nova senha</h1>
      <p>Crie uma nova senha segura e confirme.</p>
    </header>
    <main>
        <div  class="right">
      <section>
      <form action="Index.html" method="get">
        <p>Nova senha</p>
        <input id="new-password" name="new-password" type="password" required  pattern="^(?=.*[a-z])(?=.*[A-Z])(?=.*\d)(?=.*[@$!%*?&amp;])[A-Za-z\d@$!%*?&amp;]{8,}$" title="A senha deve ter pelo menos 8 caracteres, incluindo letras maiúsculas, minúsculas, números e caracteres especiais."/>

        <p>Confirmar senha</p>
        <input
          id="confirm-password"
          name="confirm-password"
          type="password"
          required
          pattern="^(?=.*[a-z])(?=.*[A-Z])(?=.*\d)(?=.*[@$!%*?&amp;])[A-Za-z\d@$!%*?&amp;]{8,}$" title="A senha deve ter pelo menos 8 caracteres, incluindo letras maiúsculas, minúsculas, números e caracteres especiais."
        />
        <button type="submit">Salvar e voltar</button>
        </section>
      </form> 
     <button type="button" onclick="location.href = 'Index.html'">
            Voltar ao login
          </button>
          </div>        
  </body>
</html>
