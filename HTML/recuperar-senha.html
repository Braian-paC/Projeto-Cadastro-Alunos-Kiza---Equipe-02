<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Recuperar senha - Portal Academico</title>
  </head>
  <body>
    <header>
      <strong>Portal Academico</strong>
      <h1>Recuperar senha</h1>
      <p>Informe seu email para receber o codigo de confirmacao.</p>
    </header>
    <main>
      <form action="codigo.html" method="get">
        <label for="email">Email</label>
        <input id="email" name="email" type="email" required />
        <button type="submit">Enviar</button>
      </form>
      <p><a href="Index.html">Voltar ao login</a></p>
    </main>
  </body>
</html>
