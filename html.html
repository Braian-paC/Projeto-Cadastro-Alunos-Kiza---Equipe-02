<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sistema de Login</title>
  <link rel="stylesheet" href="css.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
</head>

<body>

  <div class="background-shapes">
    <div class="shape shape-1"></div>
    <div class="shape shape-2"></div>
    <div class="shape shape-3"></div>
  </div>


  <div class="tela-login">
    <form action="login.php" method="post">
      <h1>Login</h1>
      <p class="subtitle">Coloque os dados da sua conta</p>

      <div class="input-group">
        <input type="text" name="Matricula" placeholder="Matrícula" required />
      </div>

      <div class="input-group">
        <input type="password" name="Senha" placeholder="Senha" required />
      </div>

      <button type="submit" class="btn-login">Entrar</button>

      <div class="links">
        <a href="recuperar-senha.html" class="forget-password">Esqueceu a senha?</a>
        <p class="register-text">Ainda não tem uma conta? <a href="cadastro.html" class="btn-register">Matricule-se</a></p>
      </div>
    </form>
  </div>
</body>

</html>
