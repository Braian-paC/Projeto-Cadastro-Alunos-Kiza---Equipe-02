<!DOCTYPE html>
<html lang="pt-BR">

<head>

<body>

     <div class="background-shapes">
    <div class="shape shape-1"></div>
    <div class="shape shape-2"></div>
    <div class="shape shape-3"></div>
  </div>


  <div class="tela-login">
    <form action="registro.php" method="post">
      <h1>Matricule-se</h1>
      <p class="subtitle">Crie sua conta para acessar o sistema</p>

      <div class="input-group">
        <input type="text" name="Nome" placeholder="Nome Completo" required />
      </div>

      <div class="input-group">
        <input type="text" name="Matricula" placeholder="Nova Matrícula" required />
      </div>

      <div class="input-group">
        <input type="password" name="Senha" placeholder="Senha" required />
      </div>

      <button type="submit" class="btn-login">Criar Conta</button>

      <div class="links">
        <p class="register-text">Já tem uma conta? <a href="html.html" class="btn-register">Fazer Login</a></p>
      </div>
    </form>
  </div>
